<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MicrotechUSA Login Test</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #64748b;
      }

      label {
        display: block;
        margin-top: 16px;
        margin-bottom: 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      #status {
        margin-top: 18px;
        padding: 12px;
        border-radius: 8px;
        background: #f8fafc;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>MicrotechUSA</h1>
      <p>Supabase Login Test</p>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Your login email"
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Your password"
      />

      <button id="loginButton">
        Sign In
      </button>

      <div id="status">
        Not signed in.
      </div>
    </div>

    <script type="module">
      import { supabase } from "./src/supabase.js";

      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const loginButton =
        document.getElementById("loginButton");

      const status =
        document.getElementById("status");

      async function checkExistingSession() {
        const {
          data: { session },
        } = await supabase.auth.getSession();

        if (session) {
          status.textContent =
            "✅ Already signed in as " +
            session.user.email;
        }
      }

      loginButton.addEventListener(
        "click",
        async () => {
          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;

          if (!email || !password) {
            status.textContent =
              "❌ Enter email and password.";
            return;
          }

          status.textContent =
            "Signing in...";

          const { data, error } =
            await supabase.auth.signInWithPassword({
              email,
              password,
            });

          if (error) {
            status.textContent =
              "❌ LOGIN ERROR: " +
              error.message;
            return;
          }

          status.textContent =
            "✅ LOGIN SUCCESSFUL: " +
            data.user.email;
        }
      );

      checkExistingSession();
    </script>
  </body>
</html>
